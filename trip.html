<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll route</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html,body{margin:0;padding:0;background:#0b0a09;color:#f5f0e8;font-family:ui-sans-serif,system-ui,sans-serif}
  #map{position:fixed;inset:0;width:100%;height:100%}
  /* HUD top-left */
  .hud{position:fixed;top:16px;left:16px;z-index:10;background:rgba(11,10,9,.85);
       padding:14px 18px;border-radius:12px;max-width:300px;backdrop-filter:blur(6px);
       border:1px solid #262220}
  .hud h1{font-size:17px;margin:0 0 6px}
  .hud p{font-size:13px;margin:0;opacity:.85;line-height:1.5}
  #progress{margin-top:10px;height:4px;background:#333;border-radius:2px;overflow:hidden}
  #bar{height:100%;width:0%;background:#e8b64c}
  #km{font-variant-numeric:tabular-nums}
  /* Controls */
  .controls{position:fixed;top:16px;right:16px;z-index:11;display:flex;gap:8px;flex-direction:column;align-items:flex-end}
  .btn{background:rgba(11,10,9,.85);border:1px solid #3a3123;color:#e8b64c;padding:8px 14px;
       border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px);
       transition:border-color .2s;font-family:inherit}
  .btn:hover{border-color:#e8b64c}
  .btn.active{background:#e8b64c;color:#1a1408}
  .back{position:fixed;bottom:20px;left:20px;z-index:11;background:rgba(232,182,76,.95);
        color:#1a1408;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;
        text-decoration:none;opacity:.9}
  /* Checkpoint toast — bottom center, small */
  .cp{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
      background:rgba(232,182,76,.95);color:#1a1408;padding:10px 22px;border-radius:999px;
      font-weight:600;font-size:15px;opacity:0;transition:opacity .35s;pointer-events:none;
      white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  .cp.show{opacity:1}
  /* Car */
  .car{position:fixed;z-index:9;pointer-events:none;will-change:transform;
       filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       background:#0b0a09;color:#f5f0e8;font-size:15px;z-index:20;flex-direction:column;gap:12px}

  /* ===== Milestone panel — right side, scroll-animated ===== */
  #panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:8;
         pointer-events:none;overflow:hidden;
         display:flex;align-items:center;justify-content:flex-end}
  .panel-inner{position:relative;width:100%;height:100%;overflow-y:auto;
               scrollbar-width:thin;scrollbar-color:#3a3123 transparent;
               pointer-events:none}
  .panel-inner::-webkit-scrollbar{width:4px}
  .panel-inner::-webkit-scrollbar-thumb{background:#3a3123;border-radius:2px}
  .milestone-card{position:absolute;left:0;right:12px;
       background:rgba(15,13,12,.92);border:1px solid #2a2520;border-radius:14px;
       overflow:hidden;backdrop-filter:blur(10px);
       box-shadow:0 8px 40px rgba(0,0,0,.4);
       opacity:0;transform:translateX(40px);
       transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1);
       pointer-events:auto}
  .milestone-card.visible{opacity:1;transform:translateX(0)}
  .milestone-card img{width:100%;height:200px;object-fit:cover;display:block;
       filter:brightness(.92) contrast(1.05)}
  .milestone-card .body{padding:14px 18px 16px}
  .milestone-card .mn{font-size:18px;font-weight:700;color:#e8b64c;margin-bottom:8px;
       line-height:1.3}
  .milestone-card .md{font-size:12.5px;opacity:.88;line-height:1.6}
  .milestone-card .mk{font-size:11px;opacity:.5;margin-top:10px;
       font-variant-numeric:tabular-nums}
  .milestone-card .alt{display:inline-block;margin-top:6px;font-size:10.5px;
       background:#221d16;border:1px solid #3a3123;color:#c99a2e;
       border-radius:999px;padding:2px 8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="hud">
  <h1 id="title">Loading…</h1>
  <p><span id="km">0</span> km <span id="sub"></span></p>
  <p style="opacity:.55">Scroll to drive.</p>
  <div id="progress"><div id="bar"></div></div>
</div>
<div class="controls">
  <button class="btn" id="revBtn" title="Drive the route in reverse">\u21BA Reverse</button>
</div>
<a class="back" href="./index.html">&larr; All trips</a>
<div class="cp" id="cpToast"></div>
<div id="panel"><div class="panel-inner" id="panelInner"></div></div>
<div id="car" class="car" aria-hidden="true">
  <svg width="30" height="56" viewBox="0 0 30 56">
    <rect x="1"  y="8"  width="4" height="10" rx="2" fill="#111"/>
    <rect x="25" y="8"  width="4" height="10" rx="2" fill="#111"/>
    <rect x="1"  y="38" width="4" height="10" rx="2" fill="#111"/>
    <rect x="25" y="38" width="4" height="10" rx="2" fill="#111"/>
    <path d="M4 12 Q4 4 15 4 Q26 4 26 12 L26 44 Q26 52 15 52 Q4 52 4 44 Z"
          fill="#e8b64c" stroke="#8a6a1e" stroke-width="1.2"/>
    <path d="M6.5 13 Q6.5 6.5 15 6.5 Q23.5 6.5 23.5 13 L23.5 17 L6.5 17 Z" fill="#f3d489"/>
    <path d="M6.5 43 L23.5 43 L23.5 44 Q23.5 49.5 15 49.5 Q6.5 49.5 6.5 44 Z" fill="#d9a83a"/>
    <path d="M7 19 L23 19 L21.5 26 L8.5 26 Z" fill="#20242c"/>
    <path d="M8.5 38 L21.5 38 L23 33 L7 33 Z" fill="#20242c"/>
    <rect x="8.5" y="26" width="13" height="12" rx="2.5" fill="#c99a2e"/>
    <circle cx="8.5" cy="7"  r="1.6" fill="#fff6d8"/>
    <circle cx="21.5" cy="7" r="1.6" fill="#fff6d8"/>
    <rect x="7"   y="48.6" width="4" height="1.8" rx="0.9" fill="#c0392b"/>
    <rect x="19"  y="48.6" width="4" height="1.8" rx="0.9" fill="#c0392b"/>
  </svg>
</div>
<div class="scroll-space" style="height:900vh;pointer-events:none;visibility:hidden"></div>
<div id="err" style="display:none">Could not load this trip. <a href="./index.html" style="color:#e8b64c">Back to all trips</a></div>

<script>
const params = new URLSearchParams(location.search);
const SLUG = params.get('trip') || '';

let LINE=[], CHECKPOINTS=[], MILESTONES={}, MILESTONE_INFO={}, TITLE='', TOTALKM=0, TOTALM=0;

fetch('data/'+SLUG+'.json').then(r=>{
  if(!r.ok)throw new Error('not found');
  return r.json();
}).then(d=>{
  LINE=d.polyline||[];
  if(!LINE.length)throw new Error('empty polyline');
  CHECKPOINTS=d.checkpoints||[];
  if(CHECKPOINTS.length && typeof CHECKPOINTS[0]==='string'){
    const n=CHECKPOINTS.length;
    CHECKPOINTS=CHECKPOINTS.map((name,i)=>({name, t:n>1?i/(n-1):0}));
  }
  MILESTONES=d.milestones||{};
  MILESTONE_INFO=d.milestone_info||{};
  TITLE=d.title||(d.from+' → '+d.to);
  TOTALM=d.total_m||0;
  TOTALKM=TOTALM/1000;
  if(!TOTALKM&&d.distance_km)TOTALKM=d.distance_km;
  document.getElementById('title').textContent=TITLE;
  document.getElementById('sub').textContent=(d.region?'· '+d.region:'');
  buildMilestoneCards();
  boot();
}).catch(()=>{document.getElementById('err').style.display='flex'});

// Build milestone cards in the right panel, positioned vertically by scroll fraction
function buildMilestoneCards(){
  const inner=document.getElementById('panelInner');
  const cps = CHECKPOINTS;
  const panelH = window.innerHeight;
  const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
  // Position each card at its scroll fraction within the panel
  cps.forEach((cp, i) => {
    const info = MILESTONE_INFO[cp.name] || {};
    const ms = MILESTONES[cp.name] || info.desc || '';
    const img = info.img || '';
    const src = info.source || (info.desc ? (info.wiki ? 'wikipedia' : '') : '');
    const card = document.createElement('div');
    card.className='milestone-card';
    card.id='ms-'+i;
    card.style.top = Math.round(cp.t * (panelH - 320)) + 'px'; // 320 ~ card height
    let html = '';
    if(img) html += '<img src="'+img+'" alt="'+cp.name+'" loading="lazy">';
    html += '<div class="body">';
    html += '<div class="mn">'+cp.name+'</div>';
    if(ms) html += '<div class="md">'+ms+'</div>';
    html += '<div class="mk">~'+Math.round(cp.t * TOTALKM)+' km from start';
    if(src === 'reddit') html += ' · sourced from Reddit';
    else if(src === 'wikipedia') html += ' · Wikipedia (CC)';
    html += '</div>';
    html += '</div>';
    card.innerHTML = html;
    inner.appendChild(card);
  });
}

function boot(){
let REVERSED=false;
window.__map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: LINE[0], zoom: 7, pitch: 45, bearing: 0,
  interactive: true,
  dragPan: false,
  dragRotate: false,
  scrollZoom: false,
  doubleClickZoom: false,
  touchZoomRotate: false,
  keyboard: false
});
const map = window.__map;

function buildRoute(){
  const L = REVERSED ? LINE.slice().reverse() : LINE;
  const CP = REVERSED ? CHECKPOINTS.slice().reverse().map((c,i)=>({name:c.name,t:i/(CHECKPOINTS.length-1||1)})) : CHECKPOINTS;
  return {L, CP};
}

const seg=[];let total=0;
let L=LINE.slice();
for(let i=1;i<L.length;i++){
  const [lng1,lat1]=L[i-1],[lng2,lat2]=L[i];
  const R=6371000,d=Math.PI/180;
  const a=Math.sin((lat2-lat1)*d/2)**2+Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin((lng2-lng1)*d/2)**2;
  total+=2*R*Math.asin(Math.sqrt(a));
  seg.push(total);
}
TOTALM=TOTALM||total;
function pointAt(t){
  const target=t*total;let i=seg.findIndex(s=>s>=target);
  if(i<0)i=seg.length-1;
  if(i===0)return{pos:L[0].slice(),i:0};
  const p0=L[i],p1=L[i+1]||L[i];
  const d0=seg[i-1],f=(target-d0)/((seg[i]-d0)||1);
  return{pos:[p0[0]+(p1[0]-p0[0])*f,p0[1]+(p1[1]-p0[1])*f],i:i};
}

const S={target:window.scrollY,current:window.scrollY,on:!matchMedia('(prefers-reduced-motion: reduce)').matches};
addEventListener('scroll',()=>{S.target=scrollY;},{passive:true});

const cam={pos:LINE[0].slice(),zoom:7,lastZoom:7,lastPx:null};
const car={pos:LINE[0].slice(),head:0};

map.on('load',()=>{
  const bounds=new maplibregl.LngLatBounds();
  for(const p of LINE)bounds.extend(p);
  map.fitBounds(bounds,{padding:80,duration:0});
  const z=Math.min(map.getZoom(),11);
  cam.zoom=z;cam.lastZoom=z;
  cam.pos=map.getCenter();

  map.addSource('route',{type:'geojson',data:{type:'Feature',properties:{},
    geometry:{type:'LineString',coordinates:L}}});
  map.addSource('done',{type:'geojson',data:{type:'Feature',properties:{},
    geometry:{type:'LineString',coordinates:[L[0]]}}});
  map.addLayer({id:'route-full',type:'line',source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#5a5245','line-width':3}});
  map.addLayer({id:'route-done',type:'line',source:'done',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#e8b64c','line-width':5,'line-blur':.4}});
  let cpFeatures = CHECKPOINTS.map(function(c){
    const target = c.t*total;
    let k = seg.findIndex(s=>s>=target);
    if(k<0)k = seg.length-1;
    return {type:'Feature',geometry:{type:'Point',coordinates:L[k]}};
  });
  map.addLayer({id:'cps',type:'circle',source:{type:'geojson',data:{type:'FeatureCollection',features:cpFeatures}},
    paint:{'circle-radius':6,'circle-color':'#e8b64c','circle-stroke-width':2,'circle-stroke-color':'#0b0a09'}});

  // ---- Click on route line or checkpoint to jump there ----
  // Enable click events on specific layers without making the map draggable/zoomable
  map['elevateLayers'] = ['route-full','route-done','cps'];
  function nearestFraction(lng, lat) {
    // Find the closest point on the polyline, return its scroll fraction (0..1)
    let bestI = 0, bestD = Infinity;
    for (let i = 0; i < L.length; i++) {
      const dx = L[i][0] - lng, dy = L[i][1] - lat;
      const d = dx*dx + dy*dy;
      if (d < bestD) { bestD = d; bestI = i; }
    }
    // Convert index to distance fraction via seg array
    const distAtI = bestI > 0 ? seg[bestI - 1] : 0;
    return distAtI / (total || 1);
  }
  function scrollToFraction(frac) {
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const targetY = Math.round(frac * maxScroll);
    window.scrollTo({ top: targetY, behavior: 'smooth' });
  }
  function handleMapClick(e) {
    const frac = nearestFraction(e.lngLat.lng, e.lngLat.lat);
    scrollToFraction(frac);
  }
  map.on('click', 'route-full', handleMapClick);
  map.on('click', 'route-done', handleMapClick);
  map.on('click', 'cps', handleMapClick);
  // Cursor pointer on hover over route/checkpoints
  map.on('mouseenter', 'route-full', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'route-full', () => { map.getCanvas().style.cursor = ''; });
  map.on('mouseenter', 'route-done', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'route-done', () => { map.getCanvas().style.cursor = ''; });
  map.on('mouseenter', 'cps', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'cps', () => { map.getCanvas().style.cursor = ''; });

  // ---- REVERSE toggle ----
  const revBtn=document.getElementById('revBtn');
  revBtn.addEventListener('click',()=>{
    REVERSED=!REVERSED;
    revBtn.classList.toggle('active',REVERSED);
    revBtn.textContent=REVERSED?'\u21BA Reversed':'\u21BA Reverse';
    const {L:nL}=buildRoute();
    L=nL;
    seg.length=0;total=0;
    for(let i=1;i<L.length;i++){
      const [lng1,lat1]=L[i-1],[lng2,lat2]=L[i];
      const R=6371000,d=Math.PI/180;
      const a=Math.sin((lat2-lat1)*d/2)**2+Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin((lng2-lng1)*d/2)**2;
      total+=2*R*Math.asin(Math.sqrt(a));
      seg.push(total);
    }
    map.getSource('route').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:L}});
    map.getSource('done').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[L[0]]}});
    const cp2=CHECKPOINTS.slice().reverse().map((c,i)=>({name:c.name,t:i/(CHECKPOINTS.length-1||1)}));
    const cf2=cp2.map(function(c){
      const target=c.t*total;
      let k=seg.findIndex(s=>s>=target);
      if(k<0)k=seg.length-1;
      return {type:'Feature',geometry:{type:'Point',coordinates:L[k]}};
    });
    map.getSource('cps').setData({type:'FeatureCollection',features:cf2});
    // Rebuild milestone cards
    const inner=document.getElementById('panelInner');
    inner.innerHTML='';
    const cps2=cp2;
    const panelH=window.innerHeight;
    cps2.forEach((cp,i)=>{
      const info=MILESTONE_INFO[cp.name]||{};
      const ms=MILESTONES[cp.name]||info.desc||'';
      const img=info.img||'';
      const card=document.createElement('div');
      card.className='milestone-card';card.id='ms-'+i;
      card.style.top=Math.round(cp.t*(panelH-320))+'px';
      let html='';
      if(img)html+='<img src="'+img+'" alt="'+cp.name+'" loading="lazy">';
      html+='<div class="body">';
      html+='<div class="mn">'+cp.name+'</div>';
      if(ms)html+='<div class="md">'+ms+'</div>';
      html+='<div class="mk">~'+Math.round(cp.t*TOTALKM)+' km from start</div>';
      html+='</div>';
      card.innerHTML=html;
      inner.appendChild(card);
    });
    window.scrollTo(0,0);S.current=0;S.target=0;
    car.pos=L[0].slice();cam.pos=L[0].slice();
    lastT=-1;lastIdx=-1;
    const b2=new maplibregl.LngLatBounds();
    for(const p of L)b2.extend(p);
    map.fitBounds(b2,{padding:80,duration:300});
    cam.zoom=Math.min(map.getZoom(),11);
    document.getElementById('bar').style.width='0%';
  });

  let lastT=-1,lastIdx=-1,frameN=0;
  function frame(){
    frameN++;
    S.current+=(S.target-S.current)*.085;
    if(Math.abs(S.target-S.current)<.08)S.current=S.target;
    const max=document.documentElement.scrollHeight-innerHeight;
    const t=max?S.current/max:0;

    if(map.loaded()){
      const r=pointAt(t);
      const pos=r.pos;

      cam.pos[0]+=(pos[0]-cam.pos[0])*.09;
      cam.pos[1]+=(pos[1]-cam.pos[1])*.09;
      const zNow=cam.zoom;
      const cur=map.getCenter();
      const px=map.project(cam.pos);
      const dist=Math.hypot(px.x-map.project(cur).x,px.y-map.project(cur).y);
      if(cam.lastPx===null||dist>5){
        map.easeTo({center:cam.pos,zoom:zNow,pitch:45,bearing:0,duration:140,
                    easing:t=>t*t*(3-2*t)});
        cam.lastPx=px;
      }
      const idx=Math.max(1,r.i);
      if(idx!==lastIdx){
        lastIdx=idx;
        const coords=L.slice(0,idx+1);coords.push(pos);
        map.getSource('done').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}});
      }

      car.pos[0]+=(pos[0]-car.pos[0])*.055;
      car.pos[1]+=(pos[1]-car.pos[1])*.055;
      const tgt=pointAt(Math.min(1,t+0.004));
      const want=Math.atan2(tgt.pos[0]-pos[0],tgt.pos[1]-pos[1])*180/Math.PI;
      let d=((want-car.head+540)%360)-180;
      car.head+=d*.09;
      const p=map.project(car.pos);
      const el=document.getElementById('car');
      el.style.left='0px';
      el.style.top='0px';
      el.style.transform='translate3d('+Math.round(p.x)+'px,'+Math.round(p.y)+'px,0) translate(-50%,-55%) rotate('+car.head.toFixed(1)+'deg)';
    }
    const km=TOTALKM?Math.round(t*TOTALKM):Math.round(t*total/1000);
    document.getElementById('km').textContent=km;
    document.getElementById('bar').style.width=(t*100)+'%';

    // Checkpoint toast + milestone panel animation
    const cpsNow = REVERSED ? CHECKPOINTS.slice().reverse().map((c,i)=>({name:c.name,t:i/(CHECKPOINTS.length-1||1)})) : CHECKPOINTS;
    for(const c of cpsNow){
      if(lastT<c.t&&t>=c.t){
        const el=document.getElementById('cpToast');
        el.textContent=c.name;el.classList.add('show');
        clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),2600);
      }
    }

    // Milestone panel: show cards near current scroll position
    // Each card becomes visible when t is within a window around its checkpoint
    const window_span = 0.08; // 8% of scroll on each side
    cpsNow.forEach((cp, i) => {
      const card = document.getElementById('ms-'+i);
      if(!card) return;
      const dt = t - cp.t;
      // Fade in as we approach, full at checkpoint, fade out after
      let opacity_t;
      if (dt < -window_span) {
        opacity_t = 0; // not yet
      } else if (dt < 0) {
        opacity_t = 1 + dt / window_span; // 0 → 1 as we approach
      } else if (dt < window_span) {
        opacity_t = 1 - dt / window_span; // 1 → 0 as we leave
      } else {
        opacity_t = 0; // past
      }
      // Smooth: only toggle class at thresholds to avoid jitter
      if (opacity_t > 0.35 && !card.classList.contains('visible')) {
        card.classList.add('visible');
      } else if (opacity_t < 0.15 && card.classList.contains('visible')) {
        card.classList.remove('visible');
      }
    });

    lastT=t;
    requestAnimationFrame(frame);
  }
  frame();
});
}
</script>
</body>
</html>
