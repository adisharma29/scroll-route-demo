<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Road Trips — Scroll-Driven Routes</title>
<style>
  html,body{margin:0;padding:0;background:#0b0a09;color:#f5f0e8;font-family:ui-sans-serif,system-ui,sans-serif}
  header{padding:48px 24px 16px;max-width:1080px;margin:0 auto}
  h1{font-size:26px;margin:0 0 8px}
  p.lede{font-size:14px;opacity:.7;margin:0 0 24px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:0 24px 48px;max-width:1080px;margin:0 auto}
  a.card{display:block;background:#161311;border:1px solid #262220;border-radius:12px;padding:16px 18px;
         text-decoration:none;color:#f5f0e8;transition:border-color .2s,transform .2s}
  a.card:hover{border-color:#e8b64c;transform:translateY(-2px)}
  .card h2{font-size:15px;margin:0 0 6px;line-height:1.4}
  .card .meta{font-size:12px;opacity:.6;display:flex;gap:10px;flex-wrap:wrap}
  .tag{display:inline-block;background:#221d16;border:1px solid #3a3123;color:#e8b64c;
       border-radius:999px;padding:2px 10px;font-size:11px;margin-top:8px}
  .count{position:fixed;top:14px;right:16px;font-size:12px;opacity:.55}
  #filter{margin:0 24px 20px;max-width:1080px;margin-left:auto;margin-right:auto}
  #filter input{width:100%;box-sizing:border-box;background:#161311;border:1px solid #262220;
       color:#f5f0e8;border-radius:10px;padding:10px 14px;font-size:14px;outline:none}
  #filter input:focus{border-color:#e8b64c}
  .empty{display:none;text-align:center;opacity:.6;padding:40px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>India Road Trips — Scroll-Driven Routes</h1>
  <p class="lede">Pick a route, scroll, and the map drives it. Built with MapLibre + OSM tiles, inspired by pear.no. <span id="total"></span></p>
</header>
<div id="filter"><input type="text" id="q" placeholder="Filter trips… (e.g. Ladakh, Kerala, Goa)"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">No trips match your filter.</div>
<div class="count" id="count"></div>

  {"slug":"devalsari","title":"Devalsari Valley Trek Drive","region":"Uttarakhand","distance_km":80},
  {"slug":"gulabi-kantha","title":"Gulabi Kantha Trek Route","region":"Uttarakhand","distance_km":150},
  {"slug":"amritsar-chandigarh","title":"Amritsar → Chandigarh","region":"Punjab","distance_km":240},
  {"slug":"bathinda-amritsar","title":"Bathinda → Amritsar Expressway","region":"Punjab","distance_km":200},

  {"slug":"bbsr-puri-konark-chilika","title":"Bhubaneswar → Puri → Konark → Chilika Lake","region":"Odisha","distance_km":150},

  {"slug":"lucknow-bangalore-8678","title":"Lucknow → Bangalore 8,678 km (Duke 250)","region":"Pan-India","distance_km":8678},
  {"slug":"chennai-sikkim-bhutan","title":"Chennai → Odisha → Sikkim → Bhutan (Mega Bike)","region":"Pan-India","distance_km":3000},
  {"slug":"india-pokhara-nepal","title":"India → Pokhara (Nepal)","region":"Cross-border","distance_km":300},
  {"slug":"india-bhutan-tigers-nest","title":"India → Bhutan (Tiger's Nest, Paro)","region":"Cross-border","distance_km":300},
  {"slug":"india-muktinath","title":"India → Muktinath (Annapurna Circuit)","region":"Cross-border","distance_km":500}
];

function fmt(n){return n>=1000?Math.round(n/1000*10)/10+'k':n+' km'}
const grid=document.getElementById('grid');
function render(f){
  const items=f?MANIFEST.filter(m=>(m.title+' '+m.region).toLowerCase().includes(f)):MANIFEST;
  grid.innerHTML=items.map(m=>
    '<a class="card" href="trip.html?trip='+m.slug+'">'+
    '<h2>'+m.title+'</h2>'+
    '<div class="meta"><span>'+fmt(m.distance_km)+'</span></div>'+
    '<span class="tag">'+m.region+'</span>'+
    '</a>').join('');
  document.getElementById('count').textContent=items.length+' trips';
  document.getElementById('total').textContent=MANIFEST.length+' trips';
  document.getElementById('empty').style.display=items.length?'none':'block';
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value.trim().toLowerCase()));
render('');
</script>
</body>
</html>
